name: Build Study Browser APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Platform Files
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp lib/main.dart main.dart.bak
          flutter create --org com.vajra.studybrowser --project-name study_browser .
          mv pubspec.yaml.bak pubspec.yaml
          mv main.dart.bak lib/main.dart

      - name: Set Custom App Logo (Error-Free Auto Resizer)
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pil
          python3 - << 'EOF'
          import os
          from PIL import Image

          logo_file = None
          for name in ['logo.png', 'logo.jpg', 'logo.jpeg']:
              if os.path.exists(name):
                  logo_file = name
                  break

          if logo_file:
              print(f"Applying custom logo from: {logo_file}")
              img = Image.open(logo_file).convert("RGBA")
              sizes = {
                  'mipmap-mdpi': 48,
                  'mipmap-hdpi': 72,
                  'mipmap-xhdpi': 96,
                  'mipmap-xxhdpi': 144,
                  'mipmap-xxxhdpi': 192,
              }
              res_dir = 'android/app/src/main/res'
              for folder, size in sizes.items():
                  out_dir = os.path.join(res_dir, folder)
                  os.makedirs(out_dir, exist_ok=True)
                  resized = img.resize((size, size), Image.Resampling.LANCZOS)
                  resized.save(os.path.join(out_dir, 'ic_launcher.png'), format='PNG')
              print("All mipmap icons updated successfully!")
          else:
              print("No logo.png found in root folder, keeping default icon.")
          EOF

          if [ -f "logo.png" ] || [ -f "logo.jpg" ] || [ -f "logo.jpeg" ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
          fi

      - name: Configure Default Browser Manifest & Deep Link Receiver
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>

              <application
                  android:label="Study Browser"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name="com.vajra.studybrowser.MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">

                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                          <category android:name="android.intent.category.APP_BROWSER"/>
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="http" />
                          <data android:scheme="https" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="http" />
                          <data android:scheme="https" />
                          <data android:mimeType="text/html" />
                          <data android:mimeType="text/plain" />
                          <data android:mimeType="application/xhtml+xml" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.WEB_SEARCH" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                      </intent-filter>

                  </activity>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          # flutter create ne default MainActivity (package: com.vajra.studybrowser.study_browser)
          # bana di hoti hai. Usse hatao taaki sirf hamari custom MainActivity bache.
          find android/app/src/main \( -name 'MainActivity.kt' -o -name 'MainActivity.java' \) -delete

          mkdir -p android/app/src/main/kotlin/com/vajra/studybrowser
          cat << 'EOF' > android/app/src/main/kotlin/com/vajra/studybrowser/MainActivity.kt
          package com.vajra.studybrowser

          import android.app.Activity
          import android.app.DownloadManager
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Environment
          import android.webkit.CookieManager
          import android.webkit.MimeTypeMap
          import android.webkit.URLUtil
          import android.webkit.WebSettings
          import android.webkit.WebView
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private var intentChannel: MethodChannel? = null
              private var engineRef: FlutterEngine? = null
              private var pendingPickResult: MethodChannel.Result? = null
              private val pickRequestCode = 7311
              private val originalWideViewPort = HashMap<Long, Boolean>()
              private val originalLayoutAlgorithm = HashMap<Long, WebSettings.LayoutAlgorithm>()

              private fun extractUrlFromIntent(targetIntent: Intent?): String? {
                  if (targetIntent == null) return null
                  val dataStr = targetIntent.dataString
                  if (!dataStr.isNullOrBlank()) return dataStr
                  val queryStr = targetIntent.getStringExtra("query") ?: targetIntent.getStringExtra(Intent.EXTRA_TEXT)
                  if (!queryStr.isNullOrBlank()) return queryStr
                  return null
              }

              // webview_flutter ka official native API (reflection se, taaki library badalne par build na tute)
              private fun findWebView(id: Long): WebView? {
                  val engine = engineRef ?: return null
                  return try {
                      val cls = Class.forName("io.flutter.plugins.webviewflutter.WebViewFlutterAndroidExternalApi")
                      val method = cls.methods.firstOrNull { it.name == "getWebView" && it.parameterTypes.size == 2 }
                      if (method == null) {
                          null
                      } else {
                          val instance = try { cls.getField("INSTANCE").get(null) } catch (e: Throwable) { null }
                          method.invoke(instance, engine, id) as? WebView
                      }
                  } catch (e: Throwable) {
                      null
                  }
              }

              // Desktop mode: wide viewport (Chrome jaisa) + download listener
              private fun configureWebView(id: Long, desktop: Boolean): Boolean {
                  val webView = findWebView(id) ?: return false
                  val s = webView.settings
                  if (!originalWideViewPort.containsKey(id)) {
                      originalWideViewPort[id] = s.useWideViewPort
                      originalLayoutAlgorithm[id] = s.layoutAlgorithm
                  }
                  if (desktop) {
                      s.useWideViewPort = true
                      s.loadWithOverviewMode = true
                      s.layoutAlgorithm = WebSettings.LayoutAlgorithm.NORMAL
                  } else {
                      originalWideViewPort[id]?.let { s.useWideViewPort = it }
                      originalLayoutAlgorithm[id]?.let { s.layoutAlgorithm = it }
                  }
                  webView.setDownloadListener { url, userAgent, contentDisposition, mimetype, _ ->
                      val args = HashMap<String, Any?>()
                      args["webViewId"] = id
                      args["url"] = url
                      args["userAgent"] = userAgent
                      args["contentDisposition"] = contentDisposition
                      args["mimeType"] = mimetype
                      runOnUiThread { intentChannel?.invokeMethod("onDownloadRequested", args) }
                  }
                  return true
              }

              private fun enqueueDownload(url: String, userAgent: String?, contentDisposition: String?, mimeType: String?): String {
                  val fileName = URLUtil.guessFileName(url, contentDisposition, mimeType)
                  val request = DownloadManager.Request(Uri.parse(url))
                  request.setTitle(fileName)
                  request.setDescription("Study Browser")
                  if (!mimeType.isNullOrBlank()) request.setMimeType(mimeType)
                  request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                  val cookie = CookieManager.getInstance().getCookie(url)
                  if (!cookie.isNullOrBlank()) request.addRequestHeader("Cookie", cookie)
                  if (!userAgent.isNullOrBlank()) request.addRequestHeader("User-Agent", userAgent)
                  val dm = getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                  try {
                      request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, fileName)
                      dm.enqueue(request)
                  } catch (e: Exception) {
                      request.setDestinationInExternalFilesDir(this, Environment.DIRECTORY_DOWNLOADS, fileName)
                      dm.enqueue(request)
                  }
                  return fileName
              }

              private fun startFilePicker(multiple: Boolean, types: List<String>, result: MethodChannel.Result) {
                  if (pendingPickResult != null) {
                      result.success(ArrayList<String>())
                      return
                  }
                  val mimeTypes = ArrayList<String>()
                  for (t in types) {
                      val trimmed = t.trim()
                      if (trimmed.isEmpty()) continue
                      if (trimmed.startsWith(".")) {
                          val mime = MimeTypeMap.getSingleton().getMimeTypeFromExtension(trimmed.substring(1).lowercase())
                          if (mime != null) mimeTypes.add(mime)
                      } else if (trimmed.contains("/")) {
                          mimeTypes.add(trimmed)
                      }
                  }
                  val pick = Intent(Intent.ACTION_GET_CONTENT)
                  pick.addCategory(Intent.CATEGORY_OPENABLE)
                  if (mimeTypes.size == 1) {
                      pick.type = mimeTypes[0]
                  } else {
                      pick.type = "*/*"
                      if (mimeTypes.size > 1) pick.putExtra(Intent.EXTRA_MIME_TYPES, mimeTypes.toTypedArray())
                  }
                  pick.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, multiple)
                  pendingPickResult = result
                  try {
                      startActivityForResult(Intent.createChooser(pick, "Select file"), pickRequestCode)
                  } catch (e: Exception) {
                      pendingPickResult = null
                      result.success(ArrayList<String>())
                  }
              }

              @Suppress("DEPRECATION")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  if (requestCode == pickRequestCode) {
                      val cb = pendingPickResult
                      pendingPickResult = null
                      val uris = ArrayList<String>()
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          val clip = data.clipData
                          if (clip != null) {
                              for (i in 0 until clip.itemCount) {
                                  val u = clip.getItemAt(i).uri
                                  if (u != null) uris.add(u.toString())
                              }
                          } else {
                              val single = data.data
                              if (single != null) uris.add(single.toString())
                          }
                      }
                      cb?.success(uris)
                      return
                  }
                  super.onActivityResult(requestCode, resultCode, data)
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  engineRef = flutterEngine
                  val channel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "study_browser/intent")
                  intentChannel = channel
                  channel.setMethodCallHandler { call, result ->
                      when (call.method) {
                          "getInitialUrl" -> {
                              val initialUrl = extractUrlFromIntent(intent)
                              intent?.data = null
                              intent?.removeExtra("query")
                              intent?.removeExtra(Intent.EXTRA_TEXT)
                              result.success(initialUrl)
                          }
                          "pickFiles" -> {
                              val multiple = call.argument<Boolean>("multiple") ?: false
                              val types = call.argument<List<String>>("types") ?: emptyList()
                              startFilePicker(multiple, types, result)
                          }
                          "downloadFile" -> {
                              val url = call.argument<String>("url")
                              if (url.isNullOrBlank()) {
                                  result.error("bad_args", "url missing", null)
                              } else {
                                  try {
                                      val name = enqueueDownload(
                                          url,
                                          call.argument<String>("userAgent"),
                                          call.argument<String>("contentDisposition"),
                                          call.argument<String>("mimeType")
                                      )
                                      result.success(name)
                                  } catch (e: Exception) {
                                      result.error("download_failed", e.message, null)
                                  }
                              }
                          }
                          "configureWebView" -> {
                              val id = call.argument<Number>("id")?.toLong()
                              val desktop = call.argument<Boolean>("desktop") ?: false
                              if (id == null) {
                                  result.success(false)
                              } else {
                                  result.success(configureWebView(id, desktop))
                              }
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              override fun onNewIntent(newIntent: Intent) {
                  super.onNewIntent(newIntent)
                  setIntent(newIntent)
                  val incomingUrl = extractUrlFromIntent(newIntent)
                  if (!incomingUrl.isNullOrBlank()) {
                      intentChannel?.invokeMethod("onNewIntentUrl", incomingUrl)
                  }
              }
          }
          EOF

          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
          fi

          if [ -f android/build.gradle ]; then
            cat << 'EOF' >> android/build.gradle
          tasks.whenTaskAdded { task ->
              if (task.name.contains("lintVital")) {
                  task.enabled = false
              }
          }
          EOF
          fi
          if [ -f android/build.gradle.kts ]; then
            cat << 'EOF' >> android/build.gradle.kts
          tasks.configureEach {
              if (name.contains("lintVital", ignoreCase = true)) {
                  enabled = false
              }
          }
          EOF
          fi

      - name: Verify MainActivity Wiring (Link Receiver Check)
        run: |
          echo "--- MainActivity files ---"
          find android/app/src/main -name 'MainActivity.*'
          echo "--- namespace / applicationId ---"
          grep -hE 'namespace|applicationId' android/app/build.gradle* || true
          echo "--- manifest activity ---"
          grep -n 'android:name=".*MainActivity"' android/app/src/main/AndroidManifest.xml

          COUNT=$(find android/app/src/main -name 'MainActivity.*' | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: exactly one MainActivity expected, found $COUNT"
            exit 1
          fi
          grep -q 'android:name="com.vajra.studybrowser.MainActivity"' android/app/src/main/AndroidManifest.xml \
            || { echo "ERROR: manifest does not point to com.vajra.studybrowser.MainActivity"; exit 1; }
          grep -q '^package com.vajra.studybrowser$' android/app/src/main/kotlin/com/vajra/studybrowser/MainActivity.kt \
            || { echo "ERROR: MainActivity.kt package mismatch"; exit 1; }
          grep -q 'study_browser/intent' android/app/src/main/kotlin/com/vajra/studybrowser/MainActivity.kt \
            || { echo "ERROR: intent channel missing in MainActivity.kt"; exit 1; }
          echo "OK: custom MainActivity is wired correctly."

      - name: Prepare Persistent Signing Key
        run: |
          # Har build ek hi signing key se sign hoga, taaki naya APK purane ke upar install ho sake.
          mkdir -p "$HOME/.android" signing
          if [ -f signing/debug.keystore ]; then
            echo "Using existing signing key from repo."
            echo "NEW_KEY=0" >> "$GITHUB_ENV"
          else
            echo "Creating signing key (first run only)..."
            keytool -genkeypair -v -keystore signing/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=Study Browser,O=Vajra,C=IN"
            echo "NEW_KEY=1" >> "$GITHUB_ENV"
          fi
          cp signing/debug.keystore "$HOME/.android/debug.keystore"

      - name: Get Packages & Build Release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Study-Browser-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Print APK Signing Fingerprint
        continue-on-error: true
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | head -5
          else
            echo "apksigner not found, skipping fingerprint print."
          fi

      - name: Backup New Signing Key (first run only)
        if: env.NEW_KEY == '1'
        uses: actions/upload-artifact@v4
        with:
          name: Study-Browser-Signing-Key
          path: signing/debug.keystore

      - name: Save New Signing Key To Repo (first run only)
        if: env.NEW_KEY == '1'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f signing/debug.keystore
          git commit -m "Add persistent signing key (APK updates install over old version)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
