name: Build Study Browser APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Platform Files
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp lib/main.dart main.dart.bak
          flutter create --org com.vajra.studybrowser --project-name study_browser .
          mv pubspec.yaml.bak pubspec.yaml
          mv main.dart.bak lib/main.dart

      - name: Configure Browser Intent, SDK 36 & Disable Lint
        run: |
          sed -i 's/android:label="study_browser"/android:label="Study Browser"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          
          # Study Browser को Realme की 'Default browser app' लिस्ट में जोड़ने के लिए Intent Filter
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.intent.action.VIEW" "$MANIFEST"; then
            sed -i '/<activity.*android:exported="true">/a \
                  <intent-filter>\n\
                      <action android:name="android.intent.action.VIEW" />\n\
                      <category android:name="android.intent.category.DEFAULT" />\n\
                      <category android:name="android.intent.category.BROWSABLE" />\n\
                      <data android:scheme="http" />\n\
                      <data android:scheme="https" />\n\
                  </intent-filter>' "$MANIFEST"
          fi

          # SDK 36 सेटिंग्स
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
          fi

          # फालतू Lint एरर रोकने के लिए
          if [ -f android/build.gradle ]; then
            cat << 'EOF' >> android/build.gradle
          tasks.whenTaskAdded { task ->
              if (task.name.contains("lintVital")) {
                  task.enabled = false
              }
          }
          EOF
          fi

      - name: Get Packages & Build Release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Study-Browser-APK
          path: build/app/outputs/flutter-apk/app-release.apk
