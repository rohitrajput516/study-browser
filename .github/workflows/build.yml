name: Build Study Browser APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Platform Files
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp lib/main.dart main.dart.bak
          flutter create --org com.vajra.studybrowser --project-name study_browser .
          mv pubspec.yaml.bak pubspec.yaml
          mv main.dart.bak lib/main.dart

      - name: Set Custom App Logo (Adaptive Clean Icon)
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pil
          python3 - << 'EOF'
          import os
          from PIL import Image

          logo_file = None
          for name in ['logo.png', 'logo.jpg', 'logo.jpeg']:
              if os.path.exists(name):
                  logo_file = name
                  break

          if logo_file:
              print(f"Applying clean adaptive logo from: {logo_file}")
              orig = Image.open(logo_file).convert("RGBA")

              # बाहर की फालतू सफ़ेद/खाली जगह को सटीकता से क्रॉप करना
              white_check = Image.new("RGBA", orig.size, (255, 255, 255, 255))
              white_check.alpha_composite(orig)
              mask = white_check.convert("L").point(lambda v: 255 if v < 245 else 0)
              bbox = mask.getbbox()
              cropped = orig.crop(bbox) if bbox else orig

              # Adaptive Background (432x432) — साफ़ सफ़ेद बैकग्राउंड
              bg_master = Image.new("RGBA", (432, 432), (255, 255, 255, 255))

              # Adaptive Foreground (432x432) — बीच में बड़ा और साफ़ लोगो (Safe Zone में)
              fg_master = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
              cw, ch = cropped.size
              scale = 286.0 / max(cw, ch)
              nw, nh = max(1, int(cw * scale)), max(1, int(ch * scale))
              fg_resized = cropped.resize((nw, nh), Image.Resampling.LANCZOS)
              fg_master.paste(fg_resized, ((432 - nw) // 2, (432 - nh) // 2), fg_resized)

              # Legacy Icon (शॉर्टकट और पुराने व्यू के लिए)
              legacy_combined = bg_master.copy()
              legacy_combined.alpha_composite(fg_master)
              legacy_cropped = legacy_combined.crop((66, 66, 366, 366))

              res_dir = 'android/app/src/main/res'
              adaptive_sizes = {
                  'mipmap-mdpi': 108,
                  'mipmap-hdpi': 162,
                  'mipmap-xhdpi': 216,
                  'mipmap-xxhdpi': 324,
                  'mipmap-xxxhdpi': 432,
              }
              legacy_sizes = {
                  'mipmap-mdpi': 48,
                  'mipmap-hdpi': 72,
                  'mipmap-xhdpi': 96,
                  'mipmap-xxhdpi': 144,
                  'mipmap-xxxhdpi': 192,
              }

              for folder, size in adaptive_sizes.items():
                  out_dir = os.path.join(res_dir, folder)
                  os.makedirs(out_dir, exist_ok=True)
                  bg_master.resize((size, size), Image.Resampling.LANCZOS).save(
                      os.path.join(out_dir, 'ic_launcher_background.png'), format='PNG'
                  )
                  fg_master.resize((size, size), Image.Resampling.LANCZOS).save(
                      os.path.join(out_dir, 'ic_launcher_foreground.png'), format='PNG'
                  )
                  l_size = legacy_sizes[folder]
                  legacy_cropped.resize((l_size, l_size), Image.Resampling.LANCZOS).save(
                      os.path.join(out_dir, 'ic_launcher.png'), format='PNG'
                  )

              anydpi_dir = os.path.join(res_dir, 'mipmap-anydpi-v26')
              os.makedirs(anydpi_dir, exist_ok=True)
              xml_content = (
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <background android:drawable="@mipmap/ic_launcher_background" />\n'
                  '    <foreground android:drawable="@mipmap/ic_launcher_foreground" />\n'
                  '</adaptive-icon>\n'
              )
              with open(os.path.join(anydpi_dir, 'ic_launcher.xml'), 'w') as f:
                  f.write(xml_content)
              print("Clean adaptive icons generated successfully!")
          else:
              print("No logo.png found in root folder, keeping default icon.")
          EOF


      - name: Configure Default Browser Manifest, FileProvider & Native Chrome Bridge
        run: |
          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-path name="external_files" path="." />
              <external-files-path name="external_app_files" path="." />
              <cache-path name="cache_files" path="." />
              <files-path name="internal_files" path="." />
          </paths>
          EOF

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="com.android.launcher.permission.INSTALL_SHORTCUT"/>

              <application
                  android:label="Study Browser"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:requestLegacyExternalStorage="true">

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">

                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                          <category android:name="android.intent.category.APP_BROWSER"/>
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="http" />
                          <data android:scheme="https" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="http" />
                          <data android:scheme="https" />
                          <data android:mimeType="text/html" />
                          <data android:mimeType="text/plain" />
                          <data android:mimeType="application/xhtml+xml" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.WEB_SEARCH" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                      </intent-filter>

                  </activity>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          rm -rf android/app/src/main/kotlin
          mkdir -p android/app/src/main/kotlin/com/vajra/studybrowser/study_browser
          cat << 'EOF' > android/app/src/main/kotlin/com/vajra/studybrowser/study_browser/MainActivity.kt
          package com.vajra.studybrowser.study_browser

          import android.app.DownloadManager
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ShortcutInfo
          import android.content.pm.ShortcutManager
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.drawable.Icon
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.os.StatFs
          import android.print.PrintAttributes
          import android.print.PrintManager
          import android.provider.Settings
          import android.view.View
          import android.view.ViewGroup
          import android.webkit.MimeTypeMap
          import android.webkit.URLUtil
          import android.webkit.WebView
          import androidx.core.content.FileProvider
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale
          import java.util.concurrent.Executors

          class MainActivity: FlutterActivity() {
              private var intentChannel: MethodChannel? = null
              private val mainHandler = Handler(Looper.getMainLooper())
              private val ioExecutor = Executors.newCachedThreadPool()

              private fun extractUrlFromIntent(targetIntent: Intent?): String? {
                  if (targetIntent == null) return null
                  val dataStr = targetIntent.dataString
                  if (!dataStr.isNullOrBlank()) return dataStr
                  val extraUrl = targetIntent.getStringExtra("shortcut_url")
                      ?: targetIntent.getStringExtra("query")
                      ?: targetIntent.getStringExtra(Intent.EXTRA_TEXT)
                  if (!extraUrl.isNullOrBlank()) return extraUrl
                  return null
              }

              private fun findAllWebViews(view: View?, outList: MutableList<WebView>) {
                  if (view == null) return
                  if (view is WebView) {
                      outList.add(view)
                  }
                  if (view is ViewGroup) {
                      for (i in 0 until view.childCount) {
                          findAllWebViews(view.getChildAt(i), outList)
                      }
                  }
              }

              private fun applyDesktopSettingsToWebViews(isDesktop: Boolean) {
                  val webViews = mutableListOf<WebView>()
                  findAllWebViews(window?.decorView, webViews)
                  for (wv in webViews) {
                      wv.settings.useWideViewPort = true
                      wv.settings.loadWithOverviewMode = isDesktop
                      wv.settings.setSupportZoom(true)
                      wv.settings.builtInZoomControls = true
                      wv.settings.displayZoomControls = false
                      wv.settings.domStorageEnabled = true
                      wv.settings.javaScriptCanOpenWindowsAutomatically = true
                  }
              }

              private fun applyWebViewDarkening(isDark: Boolean) {
                  val webViews = mutableListOf<WebView>()
                  findAllWebViews(window?.decorView, webViews)
                  for (wv in webViews) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          wv.settings.isAlgorithmicDarkeningAllowed = isDark
                      }
                  }
              }

              private fun formatBytes(bytes: Long): String {
                  if (bytes <= 0L) return "0 B"
                  return when {
                      bytes >= 1024L * 1024L * 1024L ->
                          String.format(Locale.US, "%.2f GB", bytes / (1024.0 * 1024.0 * 1024.0))
                      bytes >= 1024L * 1024L ->
                          String.format(Locale.US, "%.2f MB", bytes / (1024.0 * 1024.0))
                      bytes >= 1024L ->
                          String.format(Locale.US, "%.2f kB", bytes / 1024.0)
                      else -> "$bytes B"
                  }
              }

              private fun downloadUrlToCacheFile(imageUrl: String, fileName: String): File? {
                  return try {
                      val url = URL(imageUrl)
                      val conn = (url.openConnection() as HttpURLConnection).apply {
                          connectTimeout = 10000
                          readTimeout = 15000
                          instanceFollowRedirects = true
                          setRequestProperty(
                              "User-Agent",
                              "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36"
                          )
                      }
                      conn.connect()
                      val outFile = File(cacheDir, fileName)
                      conn.inputStream.use { input ->
                          FileOutputStream(outFile).use { output ->
                              input.copyTo(output)
                          }
                      }
                      conn.disconnect()
                      outFile
                  } catch (_: Exception) {
                      null
                  }
              }

              private fun getShareableUri(file: File): Uri {
                  return FileProvider.getUriForFile(this, "$packageName.fileprovider", file)
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  val channel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "study_browser/intent")
                  intentChannel = channel

                  channel.setMethodCallHandler { call, result ->
                      when (call.method) {
                          "getInitialUrl" -> {
                              val initialUrl = extractUrlFromIntent(intent)
                              intent?.data = null
                              result.success(initialUrl)
                          }
                          "setDesktopViewport" -> {
                              val isDesktop = call.argument<Boolean>("isDesktop") ?: false
                              applyDesktopSettingsToWebViews(isDesktop)
                              mainHandler.postDelayed({ applyDesktopSettingsToWebViews(isDesktop) }, 200)
                              mainHandler.postDelayed({ applyDesktopSettingsToWebViews(isDesktop) }, 650)
                              result.success(true)
                          }
                          "setWebViewDarkening" -> {
                              val isDark = call.argument<Boolean>("isDark") ?: false
                              applyWebViewDarkening(isDark)
                              result.success(true)
                          }
                          "captureWebViewThumbnail" -> {
                              val tabId = call.argument<String>("tabId") ?: "tab"
                              try {
                                  val webViews = mutableListOf<WebView>()
                                  findAllWebViews(window?.decorView, webViews)
                                  val wv = webViews.firstOrNull()
                                  if (wv != null && wv.width > 0 && wv.height > 0) {
                                      val targetW = 360
                                      val scale = targetW.toFloat() / wv.width.toFloat()
                                      val targetH = (wv.height * scale).toInt().coerceIn(220, 640)
                                      val bmp = Bitmap.createBitmap(targetW, targetH, Bitmap.Config.RGB_565)
                                      val canvas = Canvas(bmp)
                                      canvas.scale(scale, scale)
                                      canvas.translate(-wv.scrollX.toFloat(), -wv.scrollY.toFloat())
                                      wv.draw(canvas)
                                      val safeId = tabId.replace(Regex("[^a-zA-Z0-9_]"), "")
                                      val thumbFile = File(cacheDir, "thumb_$safeId.jpg")
                                      FileOutputStream(thumbFile).use { fos ->
                                          bmp.compress(Bitmap.CompressFormat.JPEG, 72, fos)
                                      }
                                      bmp.recycle()
                                      result.success(thumbFile.absolutePath)
                                  } else {
                                      result.success(null)
                                  }
                              } catch (_: Exception) {
                                  result.success(null)
                              }
                          }
                          "copyImageToClipboard" -> {
                              val imageUrl = call.argument<String>("url") ?: ""
                              if (imageUrl.isBlank()) {
                                  result.success(false)
                                  return@setMethodCallHandler
                              }
                              ioExecutor.execute {
                                  val file = downloadUrlToCacheFile(imageUrl, "copied_image_${System.currentTimeMillis()}.jpg")
                                  mainHandler.post {
                                      try {
                                          if (file != null && file.exists()) {
                                              val uri = getShareableUri(file)
                                              val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                                              val clip = ClipData.newUri(contentResolver, "Image", uri)
                                              cm.setPrimaryClip(clip)
                                              result.success(true)
                                          } else {
                                              val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                                              cm.setPrimaryClip(ClipData.newPlainText("Image URL", imageUrl))
                                              result.success(false)
                                          }
                                      } catch (_: Exception) {
                                          result.success(false)
                                      }
                                  }
                              }
                          }
                          "shareImage" -> {
                              val imageUrl = call.argument<String>("url") ?: ""
                              val pkg = call.argument<String>("package")
                              if (imageUrl.isBlank()) {
                                  result.success(false)
                                  return@setMethodCallHandler
                              }
                              ioExecutor.execute {
                                  val file = downloadUrlToCacheFile(imageUrl, "shared_image_${System.currentTimeMillis()}.jpg")
                                  mainHandler.post {
                                      try {
                                          if (file != null && file.exists()) {
                                              val uri = getShareableUri(file)
                                              val shareIntent = Intent(Intent.ACTION_SEND).apply {
                                                  type = "image/*"
                                                  putExtra(Intent.EXTRA_STREAM, uri)
                                                  addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                              }
                                              if (!pkg.isNullOrBlank()) {
                                                  shareIntent.setPackage(pkg)
                                                  try {
                                                      startActivity(shareIntent)
                                                      result.success(true)
                                                      return@post
                                                  } catch (_: Exception) {
                                                      shareIntent.setPackage(null)
                                                  }
                                              }
                                              val chooser = Intent.createChooser(shareIntent, "Share image")
                                              chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                              startActivity(chooser)
                                              result.success(true)
                                          } else {
                                              result.success(false)
                                          }
                                      } catch (_: Exception) {
                                          result.success(false)
                                      }
                                  }
                              }
                          }
                          "shareLink" -> {
                              val url = call.argument<String>("url") ?: ""
                              val title = call.argument<String>("title") ?: "Share Link"
                              val pkg = call.argument<String>("package")
                              try {
                                  val sendIntent = Intent(Intent.ACTION_SEND).apply {
                                      type = "text/plain"
                                      putExtra(Intent.EXTRA_SUBJECT, title)
                                      putExtra(Intent.EXTRA_TEXT, if (title.isNotBlank() && title != url) "$title\n$url" else url)
                                  }
                                  if (!pkg.isNullOrBlank()) {
                                      sendIntent.setPackage(pkg)
                                      try {
                                          startActivity(sendIntent)
                                          result.success(true)
                                          return@setMethodCallHandler
                                      } catch (_: Exception) {
                                          sendIntent.setPackage(null)
                                      }
                                  }
                                  val chooser = Intent.createChooser(sendIntent, "Share link")
                                  chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  startActivity(chooser)
                                  result.success(true)
                              } catch (_: Exception) {
                                  result.success(false)
                              }
                          }
                          "createHomeShortcut" -> {
                              val title = call.argument<String>("title")?.takeIf { it.isNotBlank() } ?: "Website"
                              val url = call.argument<String>("url") ?: "https://www.google.com"
                              try {
                                  val iconResId = applicationInfo.icon
                                  val launchIntent = Intent(applicationContext, MainActivity::class.java).apply {
                                      action = Intent.ACTION_VIEW
                                      data = Uri.parse(url)
                                      putExtra("shortcut_url", url)
                                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                                  }
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                      val sm = getSystemService(ShortcutManager::class.java)
                                      if (sm != null && sm.isRequestPinShortcutSupported) {
                                          val shortcutId = "sb_sc_" + System.currentTimeMillis()
                                          val info = ShortcutInfo.Builder(applicationContext, shortcutId)
                                              .setShortLabel(title.take(18))
                                              .setLongLabel(title.take(36))
                                              .setIcon(Icon.createWithResource(applicationContext, iconResId))
                                              .setIntent(launchIntent)
                                              .build()
                                          sm.requestPinShortcut(info, null)
                                          result.success(true)
                                          return@setMethodCallHandler
                                      }
                                  }
                                  @Suppress("DEPRECATION")
                                  val legacyIntent = Intent("com.android.launcher.action.INSTALL_SHORTCUT").apply {
                                      putExtra(Intent.EXTRA_SHORTCUT_INTENT, launchIntent)
                                      putExtra(Intent.EXTRA_SHORTCUT_NAME, title)
                                      val iconRes = Intent.ShortcutIconResource.fromContext(applicationContext, iconResId)
                                      putExtra(Intent.EXTRA_SHORTCUT_ICON_RESOURCE, iconRes)
                                  }
                                  sendBroadcast(legacyIntent)
                                  result.success(true)
                              } catch (_: Exception) {
                                  result.success(false)
                              }
                          }
                          "downloadFile" -> {
                              val url = call.argument<String>("url") ?: ""
                              val customName = call.argument<String>("fileName")
                              try {
                                  val guessedName = if (!customName.isNullOrBlank()) {
                                      customName
                                  } else {
                                      URLUtil.guessFileName(url, null, null)
                                  }
                                  val dm = getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                                  val req = DownloadManager.Request(Uri.parse(url)).apply {
                                      setTitle(guessedName)
                                      setDescription("Downloading in Study Browser...")
                                      setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                                      setAllowedOverMetered(true)
                                      setAllowedOverRoaming(true)
                                      setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, guessedName)
                                  }
                                  val dlId = dm.enqueue(req)
                                  val pubDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                                  val targetFile = File(pubDir, guessedName)
                                  result.success(mapOf(
                                      "downloadId" to dlId,
                                      "fileName" to guessedName,
                                      "filePath" to targetFile.absolutePath,
                                      "sizeLabel" to "Starting download..."
                                  ))
                              } catch (_: Exception) {
                                  result.success(null)
                              }
                          }
                          "getDownloadsProgress" -> {
                              val rawIds = call.argument<List<Any>>("ids") ?: emptyList()
                              val longIds = rawIds.mapNotNull { (it as? Number)?.toLong() }.filter { it > 0L }.toLongArray()
                              val output = mutableMapOf<String, Map<String, Any>>()
                              if (longIds.isNotEmpty()) {
                                  try {
                                      val dm = getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                                      val query = DownloadManager.Query().setFilterById(*longIds)
                                      dm.query(query)?.use { cursor ->
                                          val idxId = cursor.getColumnIndex(DownloadManager.COLUMN_ID)
                                          val idxStatus = cursor.getColumnIndex(DownloadManager.COLUMN_STATUS)
                                          val idxSoFar = cursor.getColumnIndex(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR)
                                          val idxTotal = cursor.getColumnIndex(DownloadManager.COLUMN_TOTAL_SIZE_BYTES)
                                          val idxUri = cursor.getColumnIndex(DownloadManager.COLUMN_LOCAL_URI)

                                          while (cursor.moveToNext()) {
                                              if (idxId < 0) continue
                                              val id = cursor.getLong(idxId)
                                              val statusCode = if (idxStatus >= 0) cursor.getInt(idxStatus) else DownloadManager.STATUS_RUNNING
                                              val downloaded = if (idxSoFar >= 0) cursor.getLong(idxSoFar) else 0L
                                              val total = if (idxTotal >= 0) cursor.getLong(idxTotal) else -1L
                                              val localUriStr = if (idxUri >= 0) cursor.getString(idxUri) else null

                                              val statusStr = when (statusCode) {
                                                  DownloadManager.STATUS_SUCCESSFUL -> "successful"
                                                  DownloadManager.STATUS_FAILED -> "failed"
                                                  DownloadManager.STATUS_PAUSED -> "paused"
                                                  DownloadManager.STATUS_PENDING -> "pending"
                                                  else -> "running"
                                              }

                                              val progress = when {
                                                  statusCode == DownloadManager.STATUS_SUCCESSFUL -> 1.0
                                                  total > 0L -> (downloaded.toDouble() / total.toDouble()).coerceIn(0.0, 1.0)
                                                  else -> -1.0
                                              }

                                              val sizeLabel = when {
                                                  statusCode == DownloadManager.STATUS_SUCCESSFUL -> {
                                                      val finalSize = if (total > 0L) total else downloaded
                                                      formatBytes(finalSize)
                                                  }
                                                  statusCode == DownloadManager.STATUS_FAILED -> "Download failed"
                                                  statusCode == DownloadManager.STATUS_PAUSED ->
                                                      if (total > 0L) "Paused • ${formatBytes(downloaded)} / ${formatBytes(total)}" else "Paused"
                                                  total > 0L -> {
                                                      val pct = ((downloaded * 100L) / total).toInt().coerceIn(0, 100)
                                                      "${formatBytes(downloaded)} / ${formatBytes(total)} ($pct%)"
                                                  }
                                                  downloaded > 0L -> "${formatBytes(downloaded)} downloaded..."
                                                  else -> "Pending..."
                                              }

                                              var resolvedPath = ""
                                              if (!localUriStr.isNullOrBlank()) {
                                                  try {
                                                      val parsed = Uri.parse(localUriStr)
                                                      if (parsed.scheme == "file") {
                                                          resolvedPath = parsed.path ?: ""
                                                      }
                                                  } catch (_: Exception) {}
                                              }

                                              output[id.toString()] = mapOf(
                                                  "status" to statusStr,
                                                  "bytesDownloaded" to downloaded,
                                                  "totalBytes" to total,
                                                  "progress" to progress,
                                                  "sizeLabel" to sizeLabel,
                                                  "localPath" to resolvedPath
                                              )
                                          }
                                      }
                                  } catch (_: Exception) {}
                              }
                              result.success(output)
                          }
                          "cancelDownload" -> {
                              val idNum = call.argument<Number>("downloadId")?.toLong() ?: -1L
                              if (idNum > 0L) {
                                  try {
                                      val dm = getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                                      dm.remove(idNum)
                                      result.success(true)
                                  } catch (_: Exception) {
                                      result.success(false)
                                  }
                              } else {
                                  result.success(false)
                              }
                          }
                          "getDownloadLocation" -> {
                              val pubDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                              result.success(pubDir.absolutePath)
                          }
                          "saveOfflinePage" -> {
                              val title = call.argument<String>("title") ?: "Offline_Page"
                              val html = call.argument<String>("html") ?: ""
                              try {
                                  val safeName = title.replace(Regex("[^a-zA-Z0-9_\\- ]"), "").trim().replace(" ", "_").take(40).ifEmpty { "StudyPage" }
                                  val fileName = "${safeName}.html"
                                  var outDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                                  if (!outDir.exists()) outDir.mkdirs()
                                  var outFile = File(outDir, fileName)
                                  try {
                                      outFile.writeText(html, Charsets.UTF_8)
                                  } catch (_: Exception) {
                                      outDir = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS) ?: filesDir
                                      if (!outDir.exists()) outDir.mkdirs()
                                      outFile = File(outDir, fileName)
                                      outFile.writeText(html, Charsets.UTF_8)
                                  }
                                  val bytes = outFile.length()
                                  result.success(mapOf(
                                      "fileName" to outFile.name,
                                      "filePath" to outFile.absolutePath,
                                      "sizeBytes" to bytes,
                                      "sizeLabel" to formatBytes(bytes)
                                  ))
                              } catch (_: Exception) {
                                  result.success(null)
                              }
                          }
                          "openWithSystem" -> {
                              val filePath = call.argument<String>("filePath") ?: ""
                              val url = call.argument<String>("url") ?: ""
                              try {
                                  val file = File(filePath)
                                  val targetUri: Uri
                                  val mime: String

                                  if (filePath.isNotBlank() && file.exists()) {
                                      targetUri = getShareableUri(file)
                                      val ext = file.extension.lowercase(Locale.US)
                                      mime = when (ext) {
                                          "pdf" -> "application/pdf"
                                          "zip" -> "application/zip"
                                          "apk" -> "application/vnd.android.package-archive"
                                          "html", "htm", "mhtml" -> "text/html"
                                          "jpg", "jpeg", "png", "webp", "gif" -> "image/*"
                                          "mp4", "mkv", "webm", "3gp" -> "video/*"
                                          "mp3", "wav", "m4a", "ogg" -> "audio/*"
                                          else -> MimeTypeMap.getSingleton().getMimeTypeFromExtension(ext) ?: "*/*"
                                      }
                                  } else if (url.isNotBlank()) {
                                      targetUri = Uri.parse(url)
                                      val cleanUrl = url.substringBefore("?").lowercase(Locale.US)
                                      mime = when {
                                          cleanUrl.endsWith(".pdf") -> "application/pdf"
                                          cleanUrl.endsWith(".zip") -> "application/zip"
                                          cleanUrl.endsWith(".apk") -> "application/vnd.android.package-archive"
                                          else -> "*/*"
                                      }
                                  } else {
                                      result.success(false)
                                      return@setMethodCallHandler
                                  }

                                  val viewIntent = Intent(Intent.ACTION_VIEW).apply {
                                      setDataAndType(targetUri, mime)
                                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                  }
                                  val chooser = Intent.createChooser(viewIntent, "Open with")
                                  chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  startActivity(chooser)
                                  result.success(true)
                              } catch (_: Exception) {
                                  result.success(false)
                              }
                          }
                          "renameFileOnDisk" -> {
                              val oldPath = call.argument<String>("oldPath") ?: ""
                              val newName = call.argument<String>("newName") ?: ""
                              try {
                                  val oldFile = File(oldPath)
                                  if (oldFile.exists() && newName.isNotBlank()) {
                                      val destFile = File(oldFile.parentFile, newName)
                                      val ok = oldFile.renameTo(destFile)
                                      result.success(if (ok) destFile.absolutePath else oldPath)
                                  } else {
                                      result.success(oldPath)
                                  }
                              } catch (_: Exception) {
                                  result.success(oldPath)
                              }
                          }
                          "deleteFileOnDisk" -> {
                              val path = call.argument<String>("filePath") ?: ""
                              try {
                                  val f = File(path)
                                  if (f.exists()) f.delete()
                                  result.success(true)
                              } catch (_: Exception) {
                                  result.success(false)
                              }
                          }
                          "getStorageStats" -> {
                              try {
                                  val stat = StatFs(Environment.getDataDirectory().path)
                                  val totalBytes = stat.blockCountLong * stat.blockSizeLong
                                  val availBytes = stat.availableBlocksLong * stat.blockSizeLong
                                  val usedBytes = totalBytes - availBytes
                                  val usedGb = String.format(Locale.US, "%.2f", usedBytes / (1024.0 * 1024.0 * 1024.0))
                                  val totalGb = String.format(Locale.US, "%.2f", totalBytes / (1024.0 * 1024.0 * 1024.0))
                                  val ratio = if (totalBytes > 0) (usedBytes.toDouble() / totalBytes.toDouble()) else 0.2
                                  result.success(mapOf(
                                      "label" to "Using $usedGb GB of $totalGb GB",
                                      "ratio" to ratio
                                  ))
                              } catch (_: Exception) {
                                  result.success(mapOf(
                                      "label" to "Using 9.84 GB of 110.34 GB",
                                      "ratio" to 0.12
                                  ))
                              }
                          }
                          "printPage" -> {
                              val title = call.argument<String>("title") ?: "Study_Browser_Page"
                              try {
                                  val webViews = mutableListOf<WebView>()
                                  findAllWebViews(window?.decorView, webViews)
                                  val wv = webViews.firstOrNull()
                                  if (wv != null) {
                                      val pm = getSystemService(Context.PRINT_SERVICE) as PrintManager
                                      val adapter = wv.createPrintDocumentAdapter(title)
                                      pm.print(title, adapter, PrintAttributes.Builder().build())
                                      result.success(true)
                                  } else {
                                      result.success(false)
                                  }
                              } catch (_: Exception) {
                                  result.success(false)
                              }
                          }
                          "openDefaultAppsSettings" -> {
                              try {
                                  val intent = Intent(Settings.ACTION_MANAGE_DEFAULT_APPS_SETTINGS)
                                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  startActivity(intent)
                                  result.success(true)
                              } catch (_: Exception) {
                                  result.success(false)
                              }
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              override fun onNewIntent(newIntent: Intent) {
                  super.onNewIntent(newIntent)
                  setIntent(newIntent)
                  val incomingUrl = extractUrlFromIntent(newIntent)
                  if (!incomingUrl.isNullOrBlank()) {
                      intentChannel?.invokeMethod("onNewIntentUrl", incomingUrl)
                  }
              }
          }
          EOF

          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
          fi

          if [ -f android/build.gradle ]; then
            cat << 'EOF' >> android/build.gradle
          tasks.whenTaskAdded { task ->
              if (task.name.contains("lintVital")) {
                  task.enabled = false
              }
          }
          EOF
          fi
          if [ -f android/build.gradle.kts ]; then
            cat << 'EOF' >> android/build.gradle.kts
          tasks.configureEach {
              if (name.contains("lintVital", ignoreCase = true)) {
                  enabled = false
              }
          }
          EOF
          fi

      - name: Get Packages & Build Release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Study-Browser-APK
          path: build/app/outputs/flutter-apk/app-release.apk
