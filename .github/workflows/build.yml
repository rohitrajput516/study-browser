name: Build Study Browser APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Platform Files
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp lib/main.dart main.dart.bak
          flutter create --org com.vajra.studybrowser --project-name study_browser .
          mv pubspec.yaml.bak pubspec.yaml
          mv main.dart.bak lib/main.dart

      - name: Set Custom App Logo (Error-Free Auto Resizer)
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pil
          python3 - << 'EOF'
          import os
          from PIL import Image

          logo_file = None
          for name in ['logo.png', 'logo.jpg', 'logo.jpeg']:
              if os.path.exists(name):
                  logo_file = name
                  break

          if logo_file:
              print(f"Applying custom logo from: {logo_file}")
              img = Image.open(logo_file).convert("RGBA")
              sizes = {
                  'mipmap-mdpi': 48,
                  'mipmap-hdpi': 72,
                  'mipmap-xhdpi': 96,
                  'mipmap-xxhdpi': 144,
                  'mipmap-xxxhdpi': 192,
              }
              res_dir = 'android/app/src/main/res'
              for folder, size in sizes.items():
                  out_dir = os.path.join(res_dir, folder)
                  os.makedirs(out_dir, exist_ok=True)
                  resized = img.resize((size, size), Image.Resampling.LANCZOS)
                  resized.save(os.path.join(out_dir, 'ic_launcher.png'), format='PNG')
              print("All mipmap icons updated successfully!")
          else:
              print("No logo.png found in root folder, keeping default icon.")
          EOF

          if [ -f "logo.png" ] || [ -f "logo.jpg" ] || [ -f "logo.jpeg" ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
          fi

      - name: Configure Default Browser Manifest & Native Chrome Helper Bridge
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="com.android.launcher.permission.INSTALL_SHORTCUT"/>

              <application
                  android:label="Study Browser"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:requestLegacyExternalStorage="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">

                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                          <category android:name="android.intent.category.APP_BROWSER"/>
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="http" />
                          <data android:scheme="https" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="http" />
                          <data android:scheme="https" />
                          <data android:mimeType="text/html" />
                          <data android:mimeType="text/plain" />
                          <data android:mimeType="application/xhtml+xml" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.WEB_SEARCH" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                      </intent-filter>

                  </activity>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          rm -rf android/app/src/main/kotlin
          mkdir -p android/app/src/main/kotlin/com/vajra/studybrowser/study_browser
          cat << 'EOF' > android/app/src/main/kotlin/com/vajra/studybrowser/study_browser/MainActivity.kt
          package com.vajra.studybrowser.study_browser

          import android.app.DownloadManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ShortcutInfo
          import android.content.pm.ShortcutManager
          import android.graphics.drawable.Icon
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.os.StatFs
          import android.os.StrictMode
          import android.print.PrintAttributes
          import android.print.PrintManager
          import android.provider.Settings
          import android.view.View
          import android.view.ViewGroup
          import android.webkit.MimeTypeMap
          import android.webkit.URLUtil
          import android.webkit.WebView
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.util.Locale

          class MainActivity: FlutterActivity() {
              private var intentChannel: MethodChannel? = null
              private val mainHandler = Handler(Looper.getMainLooper())

              private fun extractUrlFromIntent(targetIntent: Intent?): String? {
                  if (targetIntent == null) return null
                  val dataStr = targetIntent.dataString
                  if (!dataStr.isNullOrBlank()) return dataStr
                  val extraUrl = targetIntent.getStringExtra("shortcut_url")
                      ?: targetIntent.getStringExtra("query")
                      ?: targetIntent.getStringExtra(Intent.EXTRA_TEXT)
                  if (!extraUrl.isNullOrBlank()) return extraUrl
                  return null
              }

              private fun findAllWebViews(view: View?, outList: MutableList<WebView>) {
                  if (view == null) return
                  if (view is WebView) {
                      outList.add(view)
                  }
                  if (view is ViewGroup) {
                      for (i in 0 until view.childCount) {
                          findAllWebViews(view.getChildAt(i), outList)
                      }
                  }
              }

              private fun applyDesktopSettingsToWebViews(isDesktop: Boolean) {
                  val webViews = mutableListOf<WebView>()
                  findAllWebViews(window?.decorView, webViews)
                  for (wv in webViews) {
                      wv.settings.useWideViewPort = true
                      wv.settings.loadWithOverviewMode = isDesktop
                      wv.settings.setSupportZoom(true)
                      wv.settings.builtInZoomControls = true
                      wv.settings.displayZoomControls = false
                      wv.settings.domStorageEnabled = true
                      wv.settings.javaScriptCanOpenWindowsAutomatically = true
                  }
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  val channel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "study_browser/intent")
                  intentChannel = channel

                  channel.setMethodCallHandler { call, result ->
                      when (call.method) {
                          "getInitialUrl" -> {
                              val initialUrl = extractUrlFromIntent(intent)
                              intent?.data = null
                              result.success(initialUrl)
                          }
                          "setDesktopViewport" -> {
                              val isDesktop = call.argument<Boolean>("isDesktop") ?: false
                              applyDesktopSettingsToWebViews(isDesktop)
                              mainHandler.postDelayed({ applyDesktopSettingsToWebViews(isDesktop) }, 200)
                              mainHandler.postDelayed({ applyDesktopSettingsToWebViews(isDesktop) }, 650)
                              result.success(true)
                          }
                          "shareLink" -> {
                              val url = call.argument<String>("url") ?: ""
                              val title = call.argument<String>("title") ?: "Share Link"
                              val pkg = call.argument<String>("package")
                              try {
                                  val sendIntent = Intent(Intent.ACTION_SEND).apply {
                                      type = "text/plain"
                                      putExtra(Intent.EXTRA_SUBJECT, title)
                                      putExtra(Intent.EXTRA_TEXT, "$title\n$url")
                                  }
                                  if (!pkg.isNullOrBlank()) {
                                      sendIntent.setPackage(pkg)
                                      try {
                                          startActivity(sendIntent)
                                          result.success(true)
                                          return@setMethodCallHandler
                                      } catch (_: Exception) {
                                          sendIntent.setPackage(null)
                                      }
                                  }
                                  val chooser = Intent.createChooser(sendIntent, "Share link")
                                  chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  startActivity(chooser)
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.success(false)
                              }
                          }
                          "createHomeShortcut" -> {
                              val title = call.argument<String>("title")?.takeIf { it.isNotBlank() } ?: "Website"
                              val url = call.argument<String>("url") ?: "https://www.google.com"
                              try {
                                  val iconResId = applicationInfo.icon
                                  val launchIntent = Intent(applicationContext, MainActivity::class.java).apply {
                                      action = Intent.ACTION_VIEW
                                      data = Uri.parse(url)
                                      putExtra("shortcut_url", url)
                                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                                  }
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                      val sm = getSystemService(ShortcutManager::class.java)
                                      if (sm != null && sm.isRequestPinShortcutSupported) {
                                          val shortcutId = "sb_sc_" + System.currentTimeMillis()
                                          val info = ShortcutInfo.Builder(applicationContext, shortcutId)
                                              .setShortLabel(title.take(18))
                                              .setLongLabel(title.take(36))
                                              .setIcon(Icon.createWithResource(applicationContext, iconResId))
                                              .setIntent(launchIntent)
                                              .build()
                                          sm.requestPinShortcut(info, null)
                                          result.success(true)
                                          return@setMethodCallHandler
                                      }
                                  }
                                  @Suppress("DEPRECATION")
                                  val legacyIntent = Intent("com.android.launcher.action.INSTALL_SHORTCUT").apply {
                                      putExtra(Intent.EXTRA_SHORTCUT_INTENT, launchIntent)
                                      putExtra(Intent.EXTRA_SHORTCUT_NAME, title)
                                      val iconRes = Intent.ShortcutIconResource.fromContext(applicationContext, iconResId)
                                      putExtra(Intent.EXTRA_SHORTCUT_ICON_RESOURCE, iconRes)
                                  }
                                  sendBroadcast(legacyIntent)
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.success(false)
                              }
                          }
                          "downloadFile" -> {
                              val url = call.argument<String>("url") ?: ""
                              val customName = call.argument<String>("fileName")
                              try {
                                  val guessedName = if (!customName.isNullOrBlank()) {
                                      customName
                                  } else {
                                      URLUtil.guessFileName(url, null, null)
                                  }
                                  val dm = getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                                  val req = DownloadManager.Request(Uri.parse(url)).apply {
                                      setTitle(guessedName)
                                      setDescription("Downloading in Study Browser...")
                                      setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                                      setAllowedOverMetered(true)
                                      setAllowedOverRoaming(true)
                                      setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, guessedName)
                                  }
                                  dm.enqueue(req)
                                  val pubDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                                  val targetFile = File(pubDir, guessedName)
                                  result.success(mapOf(
                                      "fileName" to guessedName,
                                      "filePath" to targetFile.absolutePath,
                                      "sizeLabel" to "Downloading..."
                                  ))
                              } catch (e: Exception) {
                                  result.success(null)
                              }
                          }
                          "saveOfflinePage" -> {
                              val title = call.argument<String>("title") ?: "Offline_Page"
                              val html = call.argument<String>("html") ?: ""
                              try {
                                  val safeName = title.replace(Regex("[^a-zA-Z0-9_\\- ]"), "").trim().replace(" ", "_").take(40).ifEmpty { "StudyPage" }
                                  val fileName = "${safeName}.html"
                                  var outDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                                  if (!outDir.exists()) outDir.mkdirs()
                                  var outFile = File(outDir, fileName)
                                  try {
                                      outFile.writeText(html, Charsets.UTF_8)
                                  } catch (_: Exception) {
                                      outDir = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS) ?: filesDir
                                      if (!outDir.exists()) outDir.mkdirs()
                                      outFile = File(outDir, fileName)
                                      outFile.writeText(html, Charsets.UTF_8)
                                  }
                                  val bytes = outFile.length()
                                  val sizeLabel = if (bytes >= 1024 * 1024) {
                                      String.format(Locale.US, "%.2f MB", bytes / (1024.0 * 1024.0))
                                  } else {
                                      String.format(Locale.US, "%.2f kB", bytes / 1024.0)
                                  }
                                  result.success(mapOf(
                                      "fileName" to outFile.name,
                                      "filePath" to outFile.absolutePath,
                                      "sizeBytes" to bytes,
                                      "sizeLabel" to sizeLabel
                                  ))
                              } catch (e: Exception) {
                                  result.success(null)
                              }
                          }
                          "openWithSystem" -> {
                              val filePath = call.argument<String>("filePath") ?: ""
                              val url = call.argument<String>("url") ?: ""
                              try {
                                  val builder = StrictMode.VmPolicy.Builder()
                                  StrictMode.setVmPolicy(builder.build())

                                  val file = File(filePath)
                                  val targetUri: Uri
                                  val mime: String

                                  if (file.exists()) {
                                      targetUri = Uri.fromFile(file)
                                      val ext = file.extension.lowercase(Locale.US)
                                      mime = when (ext) {
                                          "pdf" -> "application/pdf"
                                          "zip" -> "application/zip"
                                          "apk" -> "application/vnd.android.package-archive"
                                          "html", "htm", "mhtml" -> "text/html"
                                          "jpg", "jpeg", "png", "webp" -> "image/*"
                                          "mp4", "mkv", "webm" -> "video/*"
                                          "mp3", "wav", "m4a" -> "audio/*"
                                          else -> MimeTypeMap.getSingleton().getMimeTypeFromExtension(ext) ?: "*/*"
                                      }
                                  } else if (url.isNotBlank()) {
                                      targetUri = Uri.parse(url)
                                      val cleanUrl = url.substringBefore("?").lowercase(Locale.US)
                                      mime = when {
                                          cleanUrl.endsWith(".pdf") -> "application/pdf"
                                          cleanUrl.endsWith(".zip") -> "application/zip"
                                          cleanUrl.endsWith(".apk") -> "application/vnd.android.package-archive"
                                          else -> "*/*"
                                      }
                                  } else {
                                      result.success(false)
                                      return@setMethodCallHandler
                                  }

                                  val viewIntent = Intent(Intent.ACTION_VIEW).apply {
                                      setDataAndType(targetUri, mime)
                                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                  }
                                  val chooser = Intent.createChooser(viewIntent, "Open with")
                                  chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  startActivity(chooser)
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.success(false)
                              }
                          }
                          "renameFileOnDisk" -> {
                              val oldPath = call.argument<String>("oldPath") ?: ""
                              val newName = call.argument<String>("newName") ?: ""
                              try {
                                  val oldFile = File(oldPath)
                                  if (oldFile.exists() && newName.isNotBlank()) {
                                      val destFile = File(oldFile.parentFile, newName)
                                      val ok = oldFile.renameTo(destFile)
                                      result.success(if (ok) destFile.absolutePath else oldPath)
                                  } else {
                                      result.success(oldPath)
                                  }
                              } catch (_: Exception) {
                                  result.success(oldPath)
                              }
                          }
                          "deleteFileOnDisk" -> {
                              val path = call.argument<String>("filePath") ?: ""
                              try {
                                  val f = File(path)
                                  if (f.exists()) f.delete()
                                  result.success(true)
                              } catch (_: Exception) {
                                  result.success(false)
                              }
                          }
                          "getStorageStats" -> {
                              try {
                                  val stat = StatFs(Environment.getDataDirectory().path)
                                  val totalBytes = stat.blockCountLong * stat.blockSizeLong
                                  val availBytes = stat.availableBlocksLong * stat.blockSizeLong
                                  val usedBytes = totalBytes - availBytes
                                  val usedGb = String.format(Locale.US, "%.2f", usedBytes / (1024.0 * 1024.0 * 1024.0))
                                  val totalGb = String.format(Locale.US, "%.2f", totalBytes / (1024.0 * 1024.0 * 1024.0))
                                  val ratio = if (totalBytes > 0) (usedBytes.toDouble() / totalBytes.toDouble()) else 0.2
                                  result.success(mapOf(
                                      "label" to "Using $usedGb GB of $totalGb GB",
                                      "ratio" to ratio
                                  ))
                              } catch (_: Exception) {
                                  result.success(mapOf(
                                      "label" to "Using 9.84 GB of 110.34 GB",
                                      "ratio" to 0.12
                                  ))
                              }
                          }
                          "printPage" -> {
                              val title = call.argument<String>("title") ?: "Study_Browser_Page"
                              try {
                                  val webViews = mutableListOf<WebView>()
                                  findAllWebViews(window?.decorView, webViews)
                                  val wv = webViews.firstOrNull()
                                  if (wv != null) {
                                      val pm = getSystemService(Context.PRINT_SERVICE) as PrintManager
                                      val adapter = wv.createPrintDocumentAdapter(title)
                                      pm.print(title, adapter, PrintAttributes.Builder().build())
                                      result.success(true)
                                  } else {
                                      result.success(false)
                                  }
                              } catch (_: Exception) {
                                  result.success(false)
                              }
                          }
                          "openDefaultAppsSettings" -> {
                              try {
                                  val intent = Intent(Settings.ACTION_MANAGE_DEFAULT_APPS_SETTINGS)
                                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  startActivity(intent)
                                  result.success(true)
                              } catch (_: Exception) {
                                  result.success(false)
                              }
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              override fun onNewIntent(newIntent: Intent) {
                  super.onNewIntent(newIntent)
                  setIntent(newIntent)
                  val incomingUrl = extractUrlFromIntent(newIntent)
                  if (!incomingUrl.isNullOrBlank()) {
                      intentChannel?.invokeMethod("onNewIntentUrl", incomingUrl)
                  }
              }
          }
          EOF

          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
          fi

          if [ -f android/build.gradle ]; then
            cat << 'EOF' >> android/build.gradle
          tasks.whenTaskAdded { task ->
              if (task.name.contains("lintVital")) {
                  task.enabled = false
              }
          }
          EOF
          fi
          if [ -f android/build.gradle.kts ]; then
            cat << 'EOF' >> android/build.gradle.kts
          tasks.configureEach {
              if (name.contains("lintVital", ignoreCase = true)) {
                  enabled = false
              }
          }
          EOF
          fi

      - name: Get Packages & Build Release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Study-Browser-APK
          path: build/app/outputs/flutter-apk/app-release.apk
